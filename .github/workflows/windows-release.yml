name: Windows installer
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Версія (необов’язково, наприклад 1.0.1)'
        required: false
        type: string
      mandatory:
        description: 'Обов’язкове оновлення для роботи із сервером'
        required: false
        default: false
        type: boolean
      notes:
        description: 'Що змінилося'
        required: false
        type: string
permissions:
  contents: write
concurrency:
  group: archive-windows-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
      - name: Test Visual C++ runtime discovery
        shell: pwsh
        run: ./tool/test_windows_runtime.ps1
      - name: Install dependencies
        working-directory: archive_flutter
        run: flutter pub get
      - name: Choose the next build number
        id: release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          ARCHIVE_MANDATORY_UPDATE: ${{ inputs.mandatory }}
        run: |
          $previous = Join-Path $env:RUNNER_TEMP 'previous-releases'
          New-Item -ItemType Directory -Path $previous -Force | Out-Null
          $pagesJson = gh api --paginate --slurp "repos/$env:GH_REPO/releases?per_page=100"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot list previous releases.' }
          $pages = ($pagesJson -join "`n") | ConvertFrom-Json
          foreach ($page in $pages) {
            foreach ($item in $page) {
              if ($item.draft -or $item.prerelease) { continue }
              if (@($item.assets | Where-Object name -eq 'latest.json').Count -eq 1) {
                $folder = Join-Path $previous ([string]$item.id)
                gh release download $item.tag_name --pattern latest.json --dir $folder
                if ($LASTEXITCODE -ne 0) { throw 'Cannot download previous release metadata.' }
              }
            }
          }
          $result = Join-Path $env:RUNNER_TEMP 'release-build.json'
          Push-Location archive_shared
          try {
            $version = if ($env:RELEASE_VERSION) { $env:RELEASE_VERSION } else { '-' }
            dart run tool/prepare_windows_release.dart $env:GITHUB_WORKSPACE $result $previous $version
            if ($LASTEXITCODE -ne 0) { throw 'Cannot prepare release version.' }
          } finally { Pop-Location }
          $release = Get-Content $result -Raw | ConvertFrom-Json
          "version=$($release.version)" >> $env:GITHUB_OUTPUT
          "build=$($release.build)" >> $env:GITHUB_OUTPUT
          "tag=$($release.tag)" >> $env:GITHUB_OUTPUT
          "minimum=$($release.minimumSupportedBuild)" >> $env:GITHUB_OUTPUT
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Build and sign installer
        shell: pwsh
        env:
          ARCHIVE_UPDATE_PRIVATE_KEY: ${{ secrets.ARCHIVE_UPDATE_PRIVATE_KEY }}
          RELEASE_NOTES: ${{ inputs.notes }}
          MINIMUM_SUPPORTED_BUILD: ${{ steps.release.outputs.minimum }}
        run: |
          if (-not $env:ARCHIVE_UPDATE_PRIVATE_KEY) { throw 'Add ARCHIVE_UPDATE_PRIVATE_KEY in repository Actions secrets once.' }
          $key = Join-Path $env:RUNNER_TEMP 'archive-update.key'
          $notes = Join-Path $env:RUNNER_TEMP 'release-notes.txt'
          $text = if ($env:RELEASE_NOTES) { $env:RELEASE_NOTES } else { 'Оновлення застосунку.' }
          [System.IO.File]::WriteAllText($notes, $text)
          try {
            [System.IO.File]::WriteAllText($key, $env:ARCHIVE_UPDATE_PRIVATE_KEY.Trim())
            ./tool/build_windows.ps1 -SigningKey $key -NotesFile $notes -MinimumSupportedBuild ([int]$env:MINIMUM_SUPPORTED_BUILD)
          } finally { Remove-Item $key -ErrorAction SilentlyContinue }
      - name: Publish completed release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_BUILD: ${{ steps.release.outputs.build }}
        run: |
          $notes = Join-Path $env:RUNNER_TEMP 'release-notes.txt'
          $installer = "dist/windows/Archive-Setup-$env:RELEASE_VERSION-$env:RELEASE_BUILD-x64.exe"
          $packages = @(Get-ChildItem dist/windows/server/*.exe)
          if ($packages.Count -ne 1) { throw 'Expected exactly one signed installer.' }
          $package = $packages[0]
          # Assets are uploaded while the release is a draft. Publish only after success.
          $existing = $null
          try {
            $existing = Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GH_REPO/releases/tags/$env:RELEASE_TAG" -Headers @{ Authorization = "Bearer $env:GH_TOKEN" }
          } catch {
            if (-not $_.Exception.Response -or [int]$_.Exception.Response.StatusCode -ne 404) { throw }
          }
          if ($existing) {
            if (-not $existing.draft -or $existing.target_commitish -ne $env:GITHUB_SHA) { throw 'Release tag is already in use.' }
          } else {
            gh release create $env:RELEASE_TAG --draft --target $env:GITHUB_SHA --title "Archive $env:RELEASE_VERSION ($env:RELEASE_BUILD)" --notes-file $notes
            if ($LASTEXITCODE -ne 0) { throw 'Cannot create draft release.' }
          }
          gh release upload $env:RELEASE_TAG $installer $package.FullName dist/windows/server/latest.json --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Cannot upload release files; draft has been retained.' }
          gh release edit $env:RELEASE_TAG --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Cannot publish the completed release.' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Archive-Windows
          path: dist/windows/
          if-no-files-found: ignore
          retention-days: 14
